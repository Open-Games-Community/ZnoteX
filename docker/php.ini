memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
date.timezone = UTC

display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

apc.enable_cli = 0
